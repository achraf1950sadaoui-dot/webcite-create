<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAWAKULL — Liste des prix</title>
  <meta name="description" content="Liste des prix — Soins de la peau. Paiement à la livraison partout au Maroc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ─── Liste des prix (page imprimable / partageable) ─── */
    .price-page {
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 48px) clamp(16px, 4vw, 40px) 80px;
    }
    .price-head {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--accent);
    }
    .price-head .brand-lg {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--primary-dark);
    }
    .price-head .tagline {
      color: var(--ink-dim);
      font-size: 14px;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .price-head h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 600;
      margin-top: 16px;
      color: var(--ink);
    }
    .price-head .date { color: var(--ink-dim); font-size: 13px; margin-top: 6px; }

    .price-list { display: flex; flex-direction: column; gap: 10px; }
    .price-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--bg-alt);
      border: 1px solid #eee5dc;
      border-radius: 14px;
    }
    .price-row .pr-emoji {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      font-size: 26px;
      border-radius: 12px;
    }
    .pr-info .pr-name { font-weight: 600; font-size: 16px; color: var(--ink); }
    .pr-info .pr-sub  { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
    .pr-price { text-align: right; white-space: nowrap; }
    .pr-price .pr-now { font-size: 20px; font-weight: 700; color: var(--primary-dark); }
    .pr-price .pr-old { font-size: 13px; color: var(--ink-dim); text-decoration: line-through; margin-left: 8px; }
    .pr-price .pr-save {
      display: inline-block; margin-top: 4px;
      background: var(--blush); color: #8a3d34;
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
    }

    .price-total {
      margin-top: 22px; padding: 18px 22px;
      background: var(--primary); color: #fff;
      border-radius: 16px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px;
    }
    .price-total b { font-size: 18px; }
    .price-total .pt-sub { font-size: 13px; opacity: .85; }

    .price-foot {
      margin-top: 28px; text-align: center;
      color: var(--ink-dim); font-size: 13px; line-height: 1.7;
    }
    .price-foot .contact { margin-top: 8px; font-size: 15px; color: var(--ink); font-weight: 600; }

    .price-actions {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      margin: 26px 0 4px;
    }
    .price-actions .back { align-self: center; color: var(--primary-dark); font-weight: 600; text-decoration: none; }

    /* ─── Impression / Export PDF ─── */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .price-row { break-inside: avoid; border-color: #ddd; }
      .price-total { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <main class="price-page" id="top">

    <div class="price-actions no-print">
      <a href="index.html" class="back">← Retour à la boutique</a>
      <button class="btn-primary sm" onclick="window.print()">🖨️ Imprimer / PDF</button>
    </div>

    <header class="price-head">
      <div class="brand-lg" data-bind="brand-name"></div>
      <div class="tagline" data-bind="brand-tagline"></div>
      <h1>Liste des prix</h1>
      <div class="date" data-bind="price-date"></div>
    </header>

    <section class="price-list" data-bind="price-list"></section>

    <div class="price-total" data-bind="price-total"></div>

    <footer class="price-foot">
      <div data-bind="price-guarantees"></div>
      <div class="contact" data-bind="price-contact"></div>
      <div class="micro" data-bind="price-copyright" style="margin-top:10px"></div>
    </footer>

  </main>

  <script type="module" src="tarifs.js?v=1"></script>
</body>
</html>
