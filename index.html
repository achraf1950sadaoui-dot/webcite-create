<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISMA — Luxury Dining, Dubai</title>
  <meta name="description" content="ISMA — A bottle-green sanctuary in Dubai. Breakfast to midnight shisha, twenty menu sections, one obsession." />
  <meta property="og:title" content="ISMA — Luxury Dining, Dubai" />
  <meta property="og:description" content="Breakfast, BBQ, pasta, sheesha — every hour, every table, the same standard." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
  <div class="scroll-progress"><span></span></div>

  <div id="preloader">
    <div class="loader-mark" data-bind="brand-mark"></div>
    <div class="loader-bar"><span></span></div>
    <p class="loader-sub">Setting your table…</p>
  </div>

  <header class="nav">
    <a href="#" class="brand">
      <span data-bind="brand-mark"></span>
      <small data-bind="brand-tagline"></small>
    </a>
    <nav>
      <a href="#story">Story</a>
      <a href="#menu">Menu</a>
      <a href="#chef">Chef</a>
      <a href="#visit">Visit</a>
    </nav>
    <a href="#reserve" class="btn-ghost magnetic">Reserve</a>
  </header>

  <!-- Hero -->
  <section class="hero">
    <canvas id="scene"></canvas>
    <div class="hero-vignette"></div>
    <div class="hero-overlay">
      <p class="eyebrow" data-bind="hero-eyebrow"></p>
      <h1 class="display split" data-bind="hero-title"></h1>
      <p class="lede" data-bind="hero-lede"></p>
      <div class="hero-cta">
        <a href="#reserve" class="btn-primary magnetic" data-bind="hero-cta-primary"></a>
        <a href="#menu" class="btn-link" data-bind="hero-cta-secondary"></a>
      </div>
      <div class="hero-meta" data-bind="hero-badges"></div>
    </div>
    <div class="hero-scroll">Scroll<span></span></div>
  </section>

  <!-- Story -->
  <section id="story" class="section dark">
    <div class="grid-2">
      <div class="reveal">
        <p class="eyebrow" data-bind="story-eyebrow"></p>
        <h2 class="display sm" data-bind="story-title"></h2>
        <div data-bind="story-body"></div>
        <ul class="ledger" data-bind="story-stats"></ul>
      </div>
      <div class="reveal frame tilt">
        <div class="frame-inner"></div>
        <p class="caption">The dining room at golden hour.</p>
      </div>
    </div>
  </section>

  <!-- Menu -->
  <section id="menu" class="section menu-section">
    <div class="section-head">
      <p class="eyebrow green" data-bind="menu-eyebrow"></p>
      <h2 class="display sm" data-bind="menu-title"></h2>
    </div>
    <div class="menu-tabs" data-bind="menu-tabs"></div>
    <div class="menu-display">
      <div class="menu-hero" data-bind="menu-hero">
        <div class="menu-hero-label">
          <small data-bind="menu-active-id">Category</small>
          <h3 data-bind="menu-active-name"></h3>
        </div>
      </div>
      <div class="menu-dishes" data-bind="menu-dishes"></div>
    </div>
  </section>

  <!-- Chef -->
  <section id="chef" class="section chef-section">
    <div class="grid-2 reverse">
      <div class="reveal portrait tilt">
        <div class="portrait-inner"></div>
        <span class="portrait-badge" data-bind="chef-name"></span>
      </div>
      <div class="reveal">
        <p class="eyebrow green" data-bind="chef-eyebrow"></p>
        <h2 class="display sm" data-bind="chef-title"></h2>
        <div data-bind="chef-body"></div>
        <blockquote data-bind="chef-quote"></blockquote>
      </div>
    </div>
  </section>

  <!-- Visit -->
  <section id="visit" class="section dark">
    <div class="section-head">
      <p class="eyebrow" data-bind="visit-eyebrow"></p>
      <h2 class="display sm" data-bind="visit-title"></h2>
    </div>
    <div class="visit-grid" data-bind="visit-grid"></div>
  </section>

  <!-- Reserve -->
  <section id="reserve" class="section reserve-section">
    <div class="reserve-wrap reveal">
      <p class="eyebrow green" data-bind="reserve-eyebrow"></p>
      <h2 class="display sm" data-bind="reserve-title"></h2>
      <form class="reserve-form" onsubmit="event.preventDefault(); this.querySelector('.confirm').classList.add('show');">
        <div class="field"><label>Name</label><input required type="text" placeholder="Your full name"/></div>
        <div class="field"><label>Email</label><input required type="email" placeholder="you@example.com"/></div>
        <div class="row">
          <div class="field"><label>Date</label><input required type="date"/></div>
          <div class="field"><label>Seating</label>
            <select data-bind="reserve-seatings"></select>
          </div>
          <div class="field"><label>Guests</label>
            <select>
              <option>2 guests</option><option>3 guests</option>
              <option>4 guests</option><option>5 guests</option>
              <option>6 guests</option><option>8 guests</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Occasion <em>(optional)</em></label>
          <input type="text" placeholder="Anniversary, business, celebration…"/>
        </div>
        <button type="submit" class="btn-primary full magnetic" data-bind="reserve-submit"></button>
        <p class="confirm" data-bind="reserve-confirm"></p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-row">
      <div class="brand-lg" data-bind="brand-mark"></div>
      <div class="foot-links">
        <a href="#story">Story</a>
        <a href="#menu">Menu</a>
        <a href="#chef">Chef</a>
        <a href="#visit">Visit</a>
        <a href="#reserve">Reserve</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span data-bind="footer-copyright"></span>
      <span data-bind="footer-motto"></span>
    </div>
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
