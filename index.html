<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-bind="meta-title">TAWAKULL — Soins de la peau</title>
  <meta name="description" data-bind="meta-desc" content="Sérum éclat & soins de la peau. Paiement à la livraison partout au Maroc." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Barre d'annonce -->
  <div class="announce" data-bind="announce"></div>

  <!-- Header -->
  <header class="nav">
    <a href="#top" class="brand">
      <span data-bind="brand-name"></span>
      <small data-bind="brand-tagline"></small>
    </a>
    <a href="#commander" class="btn-primary sm magnetic">Commander</a>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-gallery">
        <div class="hero-main"><img data-bind="hero-img" alt="" /></div>
        <div class="hero-thumbs" data-bind="hero-thumbs"></div>
      </div>
      <div class="hero-info">
        <div class="stars-row">
          <span class="stars" data-bind="hero-stars"></span>
          <span class="muted" data-bind="hero-reviews"></span>
        </div>
        <h1 class="display" data-bind="product-name"></h1>
        <p class="lede" data-bind="product-subtitle"></p>
        <ul class="badge-list" data-bind="product-badges"></ul>
        <div class="price-row">
          <span class="price" data-bind="product-price"></span>
          <span class="price-old" data-bind="product-compare"></span>
          <span class="price-save" data-bind="product-save"></span>
        </div>
        <a href="#commander" class="btn-primary full magnetic">🛒 Commander maintenant</a>
        <div class="reassure-mini" data-bind="reassure-mini"></div>
        <div class="countdown" data-bind="countdown" hidden>
          <span>⏳ Offre se termine dans</span> <b data-bind="countdown-time"></b>
        </div>
      </div>
    </section>

    <!-- Bandeau garanties -->
    <section class="trust-strip" data-bind="trust-strip"></section>

    <!-- PROBLÈME -->
    <section class="section problem">
      <p class="eyebrow" data-bind="problem-eyebrow"></p>
      <h2 class="display sm" data-bind="problem-title"></h2>
      <ul class="problem-list" data-bind="problem-points"></ul>
      <p class="solution" data-bind="problem-solution"></p>
    </section>

    <!-- BÉNÉFICES -->
    <section class="section benefits">
      <p class="eyebrow" data-bind="benefits-eyebrow"></p>
      <h2 class="display sm" data-bind="benefits-title"></h2>
      <div class="benefit-grid" data-bind="benefit-grid"></div>
    </section>

    <!-- AVANT / APRÈS -->
    <section class="section results">
      <h2 class="display sm" data-bind="results-title"></h2>
      <div class="results-wrap">
        <div class="results-img"><img data-bind="results-img" alt="Avant après" /></div>
        <div class="results-side">
          <div class="result-stats" data-bind="result-stats"></div>
          <p class="caption" data-bind="results-caption"></p>
          <p class="micro" data-bind="results-disclaimer"></p>
        </div>
      </div>
    </section>

    <!-- MODE D'EMPLOI -->
    <section class="section howto">
      <h2 class="display sm" data-bind="howto-title"></h2>
      <div class="steps" data-bind="howto-steps"></div>
    </section>

    <!-- AVIS -->
    <section class="section reviews">
      <h2 class="display sm" data-bind="reviews-title"></h2>
      <div class="review-grid" data-bind="review-grid"></div>
    </section>

    <!-- OFFRES / PACKS -->
    <section class="section offers" id="offres">
      <h2 class="display sm" data-bind="offers-title"></h2>
      <p class="muted center" data-bind="offers-subtitle"></p>
      <div class="pack-grid" data-bind="pack-grid"></div>
    </section>

    <!-- FORMULAIRE COD -->
    <section class="section order" id="commander">
      <div class="order-card">
        <h2 class="display sm" data-bind="order-title"></h2>
        <p class="muted" data-bind="order-subtitle"></p>

        <div class="order-summary" data-bind="order-summary"></div>

        <form class="order-form" id="cod-form" novalidate>
          <div class="field">
            <label>Nom complet *</label>
            <input name="name" type="text" required placeholder="Votre nom et prénom" />
            <span class="err"></span>
          </div>
          <div class="field">
            <label>Téléphone *</label>
            <input name="phone" type="tel" required inputmode="numeric" placeholder="06 12 34 56 78" />
            <span class="err"></span>
          </div>
          <div class="row">
            <div class="field">
              <label>Ville *</label>
              <select name="city" required data-bind="order-cities"></select>
              <span class="err"></span>
            </div>
            <div class="field">
              <label>Offre *</label>
              <select name="pack" required data-bind="order-packs"></select>
              <span class="err"></span>
            </div>
          </div>
          <div class="field">
            <label>Adresse *</label>
            <input name="address" type="text" required placeholder="Quartier, rue, n°…" />
            <span class="err"></span>
          </div>
          <div class="field">
            <label>Remarque <em>(optionnel)</em></label>
            <input name="note" type="text" placeholder="Heure de livraison préférée…" />
          </div>

          <div class="order-total" data-bind="order-total"></div>

          <button type="submit" class="btn-primary full big magnetic">
            ✅ Confirmer la commande
          </button>
          <p class="form-reassure" data-bind="form-reassure"></p>
          <p class="confirm" data-bind="order-success"></p>
        </form>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section faq">
      <h2 class="display sm" data-bind="faq-title"></h2>
      <div class="faq-list" data-bind="faq-list"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="brand-lg" data-bind="brand-name"></div>
    <p class="muted" data-bind="footer-note"></p>
    <div class="foot-contact" data-bind="foot-contact"></div>
    <p class="micro" data-bind="footer-copyright"></p>
  </footer>

  <!-- CTA collant (mobile) -->
  <div class="sticky-cta">
    <div class="sticky-price">
      <span data-bind="sticky-price"></span>
      <small data-bind="sticky-old"></small>
    </div>
    <a href="#commander" class="btn-primary magnetic">Commander 🛒</a>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
