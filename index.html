<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-bind="meta-title">TAWAKULL — Soins de la peau</title>
  <meta name="description" data-bind="meta-desc" content="Boutique de soins de la peau. Paiement à la livraison partout au Maroc." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Barre d'annonce -->
  <div class="announce" data-bind="announce"></div>

  <!-- Header -->
  <header class="nav">
    <a href="#top" class="brand">
      <span data-bind="brand-name"></span>
      <small data-bind="brand-tagline"></small>
    </a>
    <a href="#boutique" class="btn-primary sm magnetic">Boutique</a>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero hero-boutique">
      <div class="hero-info">
        <p class="eyebrow" data-bind="hero-eyebrow"></p>
        <h1 class="display" data-bind="hero-title"></h1>
        <p class="lede" data-bind="hero-subtitle"></p>
        <a href="#boutique" class="btn-primary big magnetic"><span data-bind="hero-cta">Découvrir</span></a>
        <div class="reassure-mini" data-bind="reassure-mini"></div>
      </div>
      <div class="hero-media">
        <img data-bind="hero-img" alt="" />
      </div>
    </section>

    <!-- Bandeau garanties -->
    <section class="trust-strip" data-bind="trust-strip"></section>

    <!-- CATALOGUE -->
    <section class="section catalog" id="boutique">
      <div class="catalog-head">
        <h2 class="display sm" data-bind="catalog-title"></h2>
        <p class="muted" data-bind="catalog-subtitle"></p>
      </div>
      <div class="product-grid" data-bind="product-grid"></div>
    </section>

    <!-- POURQUOI NOUS -->
    <section class="section benefits">
      <p class="eyebrow center" data-bind="benefits-eyebrow"></p>
      <h2 class="display sm center" data-bind="benefits-title"></h2>
      <div class="benefit-grid" data-bind="benefit-grid"></div>
    </section>

    <!-- AVIS -->
    <section class="section reviews">
      <h2 class="display sm" data-bind="reviews-title"></h2>
      <div class="review-grid" data-bind="review-grid"></div>
    </section>

    <!-- FAQ -->
    <section class="section faq">
      <h2 class="display sm" data-bind="faq-title"></h2>
      <div class="faq-list" data-bind="faq-list"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="brand-lg" data-bind="brand-name"></div>
    <p class="muted" data-bind="footer-note"></p>
    <div class="foot-contact" data-bind="foot-contact"></div>
    <p class="micro" data-bind="footer-copyright"></p>
  </footer>

  <!-- CTA collant (mobile) -->
  <div class="sticky-cta">
    <div class="sticky-price">
      <span data-bind="sticky-main">Livraison gratuite 🚚</span>
      <small data-bind="sticky-sub">Paiement à la livraison</small>
    </div>
    <a href="#boutique" class="btn-primary magnetic">Voir la boutique 🛒</a>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
